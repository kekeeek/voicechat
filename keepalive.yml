name: Keep Render awake

# Ping le serveur toutes les 10 minutes pour éviter qu'il s'endorme
# (le plan gratuit Render met le service en veille après 15 min d'inactivité).
# ⚠️ Ça veut dire que ton serveur tourne en continu, ce qui consomme le
# quota d'heures gratuites de Render (750h/mois sur le plan free). Pour un
# projet perso avec un seul service, ça reste largement dans les clous.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # permet aussi de le lancer manuellement depuis GitHub pour tester

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping le serveur
        run: curl -sf https://voicechat-z22a.onrender.com/ || echo "Ping échoué (le serveur était peut-être en train de redémarrer, pas grave)"
